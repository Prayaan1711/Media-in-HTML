<html>
    <head>
        <title>Media in HTML</title>
    </head>
    <body>
        <h1>Media in HTML</h1>
        <h2>Adding images to my webpage</h2>
        <img src="https://www.fcbarcelona.com/photo-resources/2022/08/02/ae5252d1-b79b-4950-9e34-6e67fac09bb0/LeoMessi20092010_pic_fcb-arsenal62.jpg?width=1200&height=750" alt="Image is not available" height="300" width="300">

        <audio controls autoplay>
            <source src="HTML Audio" type="audio/mpeg">
        </audio>
        <h2>Adding links</h2> 
        <a href="https://www.google.com">Google</a>
        <h2>Adding paragraphs</h2>
        <p>We can add paragraphs using the p tag.</p>
    </body>
</html>
